name: Format finance-context branch

on:
  push:
    branches:
      - feat/financial-contexts-personal-silentra-main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            app/dashboard/actions.ts \
            app/dashboard/layout.tsx \
            app/dashboard/overview/page.tsx \
            app/dashboard/transactions/import/actions.ts \
            app/dashboard/transactions/import/page.tsx

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/dashboard/actions.ts \
            app/dashboard/layout.tsx \
            app/dashboard/overview/page.tsx \
            app/dashboard/transactions/import/actions.ts \
            app/dashboard/transactions/import/page.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format finance contexts and CSV importer"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
