name: Install Motion for UI polish

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  install:
    if: github.head_ref == 'feat/moneyflow-glassmorphism-haptics-motion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Add Motion
        run: pnpm add motion@latest
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Motion is already installed."
            exit 0
          fi
          git commit -m "chore: add Motion for Animate UI v1 style transitions"
          git push origin "HEAD:refs/heads/${{ github.head_ref }}"
