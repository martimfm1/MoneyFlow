name: Temporary format helper
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'feat/moneyflow-recurring-automation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          app/api/cron/recurring-transactions/route.ts
          app/dashboard/recurring/actions.ts
          app/dashboard/recurring/income/actions.ts
          app/dashboard/recurring/income/page.tsx
          app/dashboard/recurring/page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/cron/recurring-transactions/route.ts app/dashboard/recurring/actions.ts app/dashboard/recurring/income/actions.ts app/dashboard/recurring/income/page.tsx app/dashboard/recurring/page.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format recurring automation changes"
            git push origin HEAD:${{ github.head_ref }}
          fi
