name: Format finance context implementation

on:
  push:
    branches:
      - feat/financial-contexts-personal-silentra-main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finance branch
        uses: actions/checkout@v4
        with:
          ref: feat/financial-contexts-personal-silentra-main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            app/dashboard/actions.ts \
            app/dashboard/layout.tsx \
            app/dashboard/overview/page.tsx \
            app/dashboard/transactions/import/actions.ts \
            app/dashboard/transactions/import/page.tsx

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add \
              app/dashboard/actions.ts \
              app/dashboard/layout.tsx \
              app/dashboard/overview/page.tsx \
              app/dashboard/transactions/import/actions.ts \
              app/dashboard/transactions/import/page.tsx
            git commit -m "style: format finance context implementation"
            git push origin HEAD:feat/financial-contexts-personal-silentra-main
          fi
