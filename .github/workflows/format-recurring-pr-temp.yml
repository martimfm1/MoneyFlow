name: Temporary recurring PR formatter

on:
  push:
    branches:
      - feat/moneyflow-recurring-automation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/moneyflow-recurring-automation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: |
          git fetch origin main
          FILES="$(git diff --name-only origin/main...HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.json' '*.md' '*.css' '*.yml' '*.yaml')"
          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | xargs -r pnpm exec prettier --write
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            if ! git diff --cached --quiet; then
              git commit -m "style: format recurring automation PR"
              git push origin "HEAD:refs/heads/feat/moneyflow-recurring-automation"
            fi
          fi
